<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bản đồ Thần Miếu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<button id="toggleSidebar">☰ Bộ lọc / Danh sách</button>
<div id="sidebar">
  <h2>Danh sách Thần Miếu</h2>
  <div id="filters">
    <label>Loại Thần:
      <select id="filterLoai">
        <option value="">Tất cả</option>
      </select>
    </label>
    <label>Tộc người:
      <select id="filterToc">
        <option value="">Tất cả</option>
      </select>
    </label>
    <label>Phường/Xã:
      <select id="filterPhuongXa">
        <option value="">Tất cả</option>
      </select>
    </label>
    <button id="resetFilter">Reset</button>
  </div>
  <ul id="placeList"></ul>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
