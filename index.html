<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bản đồ cơ sở thờ tự</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script src="script.js"></script>
  
</head>
<body>

<div id="sidebar">
  <h3>Danh sách cơ sở thờ tự</h3>

  <!-- FILTER -->
  <div class="filter-container">

    <label>Loại cơ sở</label>
    <select id="filterLoaiCoSo"><option value="">Tất cả</option></select>

    <label>Loại thần</label>
    <select id="filterLoai"><option value="">Tất cả</option></select>

    <label>Tộc</label>
    <select id="filterToc"><option value="">Tất cả</option></select>

    <label>Phường/Xã</label>
    <select id="filterPhuongXa"><option value="">Tất cả</option></select>

    <button id="resetFilter">Reset</button>

  </div>

  <ul id="placeList"></ul>
</div>

<button id="toggleSidebar">☰</button>
<div id="routeBox">
  <div id="routeInfo">Chưa có tuyến đường</div>
  <button onclick="clearRoute()">❌ Xóa</button>
</div>
  
<div id="map"></div>



 <!-- MODAL CHI TIẾT -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div> 
  
</body>
</html>
